<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>无限滑动</title>
    <script src="gsap.js"></script>
    <style>
      * {
        padding: 0;
        margin: 0;
      }

      img {
        pointer-events: none;
        user-select: none;
      }

      div {
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
      }

      body {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
        background-color: #171717;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.14) 1px,
          transparent 1px
        );
        background-size: 26px 26px;
        overflow: hidden;
      }

      .photos {
        position: absolute;
        flex-direction: column;
        overflow: hidden;
        cursor: pointer;
      }

      .photos_line {
        font-size: 1px;
        height: 312em;
        margin-bottom: 68em;
        flex-shrink: 0;
      }

      .photos_line_photo {
        font-size: 1px;
        width: 234em;
        height: 100%;
        margin-right: 56em;
        border-radius: 12em;
        background-color: transparent;
        overflow: hidden;
        flex-shrink: 0;
      }

      .photos_line_photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transition: 0.3s ease;
      }

      .photos_line_photo:hover img {
        transform: scale(1.2);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 10;
        padding: 7vh 6vw;
        background: rgba(7, 7, 7, 0.9);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.28s ease, visibility 0.28s ease;
        cursor: zoom-out;
      }

      .lightbox.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .lightbox_image {
        display: block;
        width: auto;
        height: auto;
        max-width: min(90vw, 1200px);
        max-height: 86vh;
        object-fit: contain;
        pointer-events: auto;
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        cursor: default;
        transform: scale(0.96);
        transition: transform 0.28s ease;
      }

      .lightbox.is-open .lightbox_image {
        transform: scale(1);
      }

      .lightbox_close {
        position: absolute;
        top: 24px;
        right: 28px;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        color: #f5f5f5;
        background: rgba(255, 255, 255, 0.08);
        font: 300 30px/1 sans-serif;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .lightbox_close:hover,
      .lightbox_close:focus-visible {
        background: rgba(255, 255, 255, 0.16);
        transform: rotate(6deg);
        outline: none;
      }

      @media screen and (max-aspect-ratio: 1.5/1) {
        .photos_line,
        .photos_line_photo {
          font-size: 2px;
        }
      }

      @media screen and (max-aspect-ratio: 0.8/1) {
        .photos_line,
        .photos_line_photo {
          font-size: 2.8px;
        }
      }
    </style>
  </head>

  <body>

  <script>
    // JIEJOE produce
    // b站主页：https://space.bilibili.com/3546390319860710
    const photobox = {
      container: document.querySelector(".photos"),
      lightbox: document.querySelector(".lightbox"),
      lightbox_image: document.querySelector(".lightbox_image"),
      lightbox_close: document.querySelector(".lightbox_close"),
      img_data: [],
      container_width: 0,
      container_height: 0,
      photo_width: 0,
      photo_height: 0,
      if_movable: false,
      did_drag: false,
      pressed_photo: null,
      down_x: 0,
      down_y: 0,
      mouse_x: 0,
      mouse_y: 0,
      standard_width: 1440,
      base_scale: 1,
      zoom_scale: 1,
      min_zoom: 0.55,
      max_zoom: 2.2,
      scene_x: 0,
      scene_y: 0,
      drag_threshold: 6,
      scale_nums: 1,
      scene_ani: null,
      is_lightbox_open: false,
      init() {
        this.resize();
        window.addEventListener("resize", () => {
          this.resize();
        });
        window.addEventListener("wheel", (event) => this.zoom(event), {
          passive: false,
        });
        this.container.addEventListener("mousedown", (event) => {
          if (this.is_lightbox_open || event.button !== 0) return;
          this.if_movable = true;
          this.did_drag = false;
          this.pressed_photo = event.target.closest(".photos_line_photo");
          this.down_x = event.clientX;
          this.down_y = event.clientY;
          this.mouse_x = event.clientX;
          this.mouse_y = event.clientY;
        });
        window.addEventListener("mouseup", (event) => this.endDrag(event));
        this.container.addEventListener("mouseleave", () => {
          if (this.if_movable) this.did_drag = true;
          this.if_movable = false;
          this.pressed_photo = null;
        });
        this.container.addEventListener("mousemove", (event) => {
          if (!this.if_movable || this.is_lightbox_open) return;
          if (
            Math.hypot(
              event.clientX - this.down_x,
              event.clientY - this.down_y
            ) > this.drag_threshold
          ) {
            this.did_drag = true;
          }
          this.move(event.clientX, event.clientY);
        });
        this.lightbox.addEventListener("click", (event) => {
          if (event.target === this.lightbox) this.closeLightbox();
        });
        this.lightbox_close.addEventListener("click", () => {
          this.closeLightbox();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") this.closeLightbox();
        });
      },
      clampZoom(value) {
        return Math.min(this.max_zoom, Math.max(this.min_zoom, value));
      },
      calculateZoom(clientX, clientY, nextZoom) {
        const clamped = this.clampZoom(nextZoom);
        const ratio = clamped / this.zoom_scale;
        const centerX = window.innerWidth / 2 + this.scene_x;
        const centerY = window.innerHeight / 2 + this.scene_y;
        this.scene_x += (1 - ratio) * (clientX - centerX);
        this.scene_y += (1 - ratio) * (clientY - centerY);
        this.zoom_scale = clamped;
      },
      renderScene(duration = 0) {
        this.scale_nums = this.base_scale * this.zoom_scale;
        if (this.scene_ani) this.scene_ani.kill();
        this.scene_ani = gsap.to(this.container, {
          x: this.scene_x,
          y: this.scene_y,
          scale: this.scale_nums,
          transformOrigin: "center center",
          duration,
          ease: "power3.out",
          overwrite: true,
        });
      },
      zoom(event) {
        if (this.is_lightbox_open) return;
        event.preventDefault();
        const nextZoom = this.clampZoom(
          this.zoom_scale * Math.exp(-event.deltaY * 0.001)
        );
        if (Math.abs(nextZoom - this.zoom_scale) < 0.0001) return;
        this.calculateZoom(event.clientX, event.clientY, nextZoom);
        this.renderScene(0.28);
      },
      endDrag(event) {
        if (!this.if_movable) return;
        const pressedPhoto = this.pressed_photo;
        const releasedPhoto = event.target.closest?.(".photos_line_photo");
        const shouldOpen =
          !this.did_drag && pressedPhoto && releasedPhoto === pressedPhoto;
        this.if_movable = false;
        this.pressed_photo = null;
        if (shouldOpen) this.openLightbox(pressedPhoto);
      },
      openLightbox(photo) {
        const image = photo.querySelector("img");
        if (!image) return;
        this.is_lightbox_open = true;
        this.lightbox_image.src = image.src;
        this.lightbox_image.alt = image.alt || "大图预览";
        this.lightbox.classList.add("is-open");
        this.lightbox.setAttribute("aria-hidden", "false");
        this.lightbox_close.focus();
      },
      closeLightbox() {
        if (!this.is_lightbox_open) return;
        this.is_lightbox_open = false;
        this.lightbox.classList.remove("is-open");
        this.lightbox.setAttribute("aria-hidden", "true");
      },
      resize() {
        let imgs = [...document.querySelectorAll(".photos_line_photo")];
        this.container_width = this.container.offsetWidth;
        this.container_height = this.container.offsetHeight;
        this.photo_width = imgs[0].offsetWidth;
        this.photo_height = imgs[0].offsetHeight;
        this.base_scale = document.body.offsetWidth / this.standard_width;
        this.renderScene(0);
        gsap.to(imgs, {
          transform: `translate(0,0)`,
          duration: 0,
          ease: "power4.out",
        });
        this.img_data = [];
        imgs.forEach((img) => {
          this.img_data.push({
            node: img,
            x: img.offsetLeft,
            y: img.offsetTop,
            mov_x: 0,
            mov_y: 0,
            ani: 0,
          });
        });
      },
      move(x, y) {
        if (!this.if_movable) return 0;
        let distance_x = (x - this.mouse_x) / this.scale_nums;
        let distance_y = (y - this.mouse_y) / this.scale_nums;
        this.img_data.forEach((img) => {
          let duration = 1;
          img.mov_x += distance_x;
          if (img.x + img.mov_x > this.container_width) {
            img.mov_x -= this.container_width;
            duration = 0;
          }
          if (img.x + img.mov_x < -this.photo_width) {
            img.mov_x += this.container_width;
            duration = 0;
          }
          img.mov_y += distance_y;
          if (img.y + img.mov_y > this.container_height) {
            img.mov_y -= this.container_height;
            duration = 0;
          }
          if (img.y + img.mov_y < -this.photo_height) {
            img.mov_y += this.container_height;
            duration = 0;
          }
          if (img.ani) img.ani.kill();
          img.ani = gsap.to(img.node, {
            transform: `translate(${img.mov_x}px,${img.mov_y}px)`,
            duration: duration,
            ease: "power4.out",
          });
        });
        this.mouse_x = x;
        this.mouse_y = y;
      },
    };
    photobox.init();
  </script>
